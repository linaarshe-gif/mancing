<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Angler Pro - Enhanced</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

        :root {
            --primary: #4a90e2;
            --secondary: #6c5ce7;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f1c40f;
            --dark: #2d3436;
            --glass: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: #090910;
            font-family: 'Nunito', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        #game-container {
            position: relative; width: 100%; max-width: 600px; height: 100%; max-height: 900px;
            background: #000; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8); border-radius: 12px;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* --- LOGO GALLERY - 5 LOGOS --- */
        .logo-gallery {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            z-index: 50;
            padding: 10px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 95%;
        }

        .logo-item {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-item:hover {
            transform: translateY(-5px) scale(1.1);
            z-index: 10;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .logo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .logo-tooltip {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            font-weight: bold;
        }

        .logo-item:hover .logo-tooltip {
            opacity: 1;
        }

        /* --- HEADER & UI --- */
        .top-ui {
            position: absolute; 
            top: 110px; 
            left: 0; 
            width: 100%;
            padding: 15px; 
            z-index: 10; 
            pointer-events: none;
            display: flex; 
            flex-direction: column; 
            gap: 10px;
        }

        .logo-area {
            text-align: center; 
            transition: opacity 0.5s, transform 0.5s;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .logo-wrapper {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 100%);
            padding: 10px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.9);
            border: 3px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
        }

        .logo-text {
            font-family: 'Fredoka One', cursive; font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2)); letter-spacing: 2px;
        }

        .sub-logo { 
            font-size: 11px; color: #f39c12; font-weight: 900; letter-spacing: 4px; 
            margin-top: -3px; text-transform: uppercase;
        }

        .logo-icon {
            font-size: 32px;
            margin-bottom: 2px;
            animation: wave 2s ease-in-out infinite;
            display: block;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        /* --- STATS BARS --- */
        .stats-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        
        .badge {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            color: white; padding: 6px 12px; border-radius: 20px;
            font-family: 'Fredoka One'; font-size: 14px; border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; gap: 6px;
        }

        .xp-container {
            flex-grow: 1; height: 12px; background: rgba(0,0,0,0.6);
            border-radius: 10px; border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden; position: relative;
        }

        .xp-fill {
            height: 100%; background: linear-gradient(90deg, var(--secondary), var(--primary));
            width: 0%; transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 10px var(--primary);
        }

        .level-badge {
            position: absolute; right: 0; top: -25px;
            background: var(--warning); color: var(--dark);
            padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* --- CONTROLS --- */
        .action-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 4px solid white; color: white;
            font-family: 'Fredoka One'; font-size: 18px;
            cursor: pointer; z-index: 20; pointer-events: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.3);
            transition: all 0.1s; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; line-height: 1.1;
        }

        .action-btn:active { transform: translateX(-50%) scale(0.95); box-shadow: 0 5px 10px rgba(0,0,0,0.4); }
        .action-btn.reeling { background: linear-gradient(135deg, var(--danger), #d63031); width: 120px; height: 120px; font-size: 22px; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.05); } }

        .side-btn {
            position: absolute; bottom: 30px; width: 50px; height: 50px;
            background: white; border-radius: 50%; border: none;
            font-size: 24px; cursor: pointer; z-index: 20; pointer-events: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s;
        }
        .side-btn:active { transform: scale(0.9); }
        #shop-btn { right: 20px; background: var(--warning); }
        #music-btn { left: 20px; background: var(--secondary); color: white; }

        /* --- MINIGAME & NOTIFICATIONS --- */
        #minigame-ui {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 260px; background: rgba(20, 20, 30, 0.95); backdrop-filter: blur(10px);
            border-radius: 15px; padding: 20px; border: 2px solid white;
            display: none; z-index: 30; color: white; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .bar-wrap { margin: 15px 0; text-align: left; }
        .bar-label { font-size: 12px; font-weight: bold; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        .bar-bg { width: 100%; height: 16px; background: #333; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        .bar-fill { height: 100%; transition: width 0.1s linear; }
        #tension-bar { background: linear-gradient(90deg, var(--success), var(--warning), var(--danger)); width: 0%; }
        #stamina-bar { background: var(--primary); width: 100%; }

        #notification {
            position: absolute; top: 30%; left: 50%; transform: translateX(-50%) scale(0.8);
            background: white; padding: 10px 25px; border-radius: 30px;
            font-family: 'Fredoka One'; color: var(--danger); font-size: 20px;
            opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; z-index: 40; box-shadow: 0 10px 30px rgba(0,0,0,0.3); white-space: nowrap;
        }
        #notification.show { opacity: 1; transform: translateX(-50%) scale(1); }

        /* --- CATCH CARD --- */
        #catch-card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: white; width: 280px; padding: 25px; border-radius: 25px;
            text-align: center; z-index: 50; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4); border: 5px solid var(--warning);
        }
        #catch-card.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .fish-display { font-size: 80px; margin: 10px 0; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .catch-title { font-family: 'Fredoka One'; font-size: 24px; color: var(--dark); margin: 0; }
        .catch-xp { color: var(--secondary); font-weight: 900; font-size: 18px; margin-top: 5px; }
        .catch-val { color: var(--success); font-weight: bold; font-size: 20px; margin-top: 10px; }

        /* --- SHOP & START SCREEN --- */
        .modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(8px);
            z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center;
            color: white; padding: 20px;
        }
        .modal h2 { font-family: 'Fredoka One'; font-size: 30px; color: var(--warning); margin-bottom: 20px; }
        
        .shop-list { width: 100%; max-height: 60%; overflow-y: auto; padding-right: 5px; }
        .shop-item {
            background: rgba(255,255,255,0.1); margin-bottom: 10px; padding: 15px;
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid transparent; transition: all 0.2s; cursor: pointer;
        }
        .shop-item:hover { background: rgba(255,255,255,0.15); }
        .shop-item.equipped { border-left-color: var(--success); background: rgba(46, 204, 113, 0.1); }
        .shop-item.disabled { opacity: 0.5; pointer-events: none; }
        
        .item-name { font-weight: bold; font-size: 16px; }
        .item-desc { font-size: 12px; color: #aaa; margin-top: 4px; }
        .item-cost { font-family: 'Fredoka One'; color: var(--warning); }

        .close-btn {
            margin-top: 20px; padding: 12px 40px; background: var(--danger);
            color: white; border: none; border-radius: 25px; font-family: 'Fredoka One';
            font-size: 18px; cursor: pointer; box-shadow: 0 5px 0 #c0392b;
        }
        .close-btn:active { transform: translateY(5px); box-shadow: none; }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #2c3e50, #000);
            z-index: 200; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }
        #start-screen h1 { 
            font-family: 'Fredoka One'; font-size: 42px; color: white; margin-bottom: 10px; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        #start-screen p { color: #bdc3c7; font-size: 18px; margin-bottom: 40px; max-width: 80%; }
        .start-btn {
            padding: 18px 50px; font-size: 24px; font-family: 'Fredoka One';
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.4); transition: transform 0.2s;
        }
        .start-btn:hover { transform: scale(1.05); }

        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

        @media (max-width: 600px) {
            .logo-gallery {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .logo-item:nth-child(4),
            .logo-item:nth-child(5) {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- 5 LOGOS GALLERY -->
    <div class="logo-gallery">
        <div class="logo-item" onclick="window.open('https://example.com/han', '_blank')">

        <div class="logo-item" onclick="window.open('https://example.com/smkn1sand en', '_blank')">
            <img src="lgo.jpeg" alt="SMKN 1 Sand en" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cpath d=%22M50 5 L90 30 L80 90 L50 95 L20 90 L10 30 Z%22 fill=%22%232c3e50%22 stroke=%22%23f1c40f%22 stroke-width=%223%22/%3E%3Cpath d=%22M30 50 Q50 70 70 50%22 stroke=%22%23e74c3c%22 stroke-width=%224%22 fill=%22none%22/%3E%3Ctext x=%2250%22 y=%2285%22 text-anchor=%22middle%22 font-size=%228%22 fill=%22%23f1c40f%22%3ESMKN1%3C/text%3E%3C/svg%3E'">
            <div class="logo-tooltip">SMKN 1</div>
        </div>
    </div>

    <!-- TOP UI -->
    <div class="top-ui" id="top-ui">
        <div class="logo-area" id="game-logo">
            <div class="logo-wrapper">
                <span class="logo-icon">🎣</span>
                <div class="logo-text">MASTER ANGLER</div>
                <div class="sub-logo">PRO EDITION</div>
            </div>
        </div>
        
        <div class="stats-row">
            <div class="badge">💰 <span id="money-display">0</span></div>
            <div style="flex-grow:1; position:relative;">
                <div class="level-badge">LVL <span id="level-display">1</span></div>
                <div class="xp-container"><div class="xp-fill" id="xp-bar"></div></div>

        </div>
    </div>

    <!-- CONTROLS -->
    <button class="side-btn" id="music-btn" onclick="toggleMusic()">🎵</button>
    <button class="action-btn" id="action-btn">LEMPAR<br><span style="font-size:12px; opacity:0.8">(Spasi)</span></button>
    <button class="side-btn" id="shop-btn" onclick="toggleShop()">🛒</button>

    <!-- MINIGAME -->
    <div id="minigame-ui">
        <h3 style="margin:0 0 10px 0; font-family:'Fredoka One'"> TARIK IKANNYA!</h3>
        <div class="bar-wrap">
            <span class="bar-label">Ketegangan Garis</span>
            <div class="bar-bg"><div id="tension-bar" class="bar-fill"></div></div>

        <div class="bar-wrap">

        <button class="start-btn" onclick="startGame()">MULAI PETUALANGAN</button>

<script>
/**
 * MASTER ANGLER PRO - ENHANCED ENGINE
 */

// --- CONFIGURATION DATA ---
const FISH_DB = [
    { id: 'carp', name: 'Ikan Mas', value: 50, xp: 15, diff: 1, stamina: 100, depth: [0.4, 0.8], weather: ['clear', 'rain'], minLvl: 1, color: '#f1c40f', shape: 'standard' },

    { id: 'blue', name: 'Ikan Biru', value: 250, xp: 60, diff: 2.5, stamina: 200, depth: [0.6, 1.0], weather: ['clear', 'cloudy'], minLvl: 4, color: '#3498db', shape: 'long' },

    { id: 'shark', name: 'Hiu Kecil', value: 1000, xp: 250, diff: 5, stamina: 450, depth: [0.8, 1.0], weather: ['all'], minLvl: 8, color: '#7f8c8d', shape: 'shark' },
    { id: 'golden', name: 'Koi Emas', value: 2500, xp: 600, diff: 8, stamina: 800, depth: [0.9, 1.0], weather: ['night'], minLvl: 10, color: '#ffd700', shape: 'koi' }
];

const UPGRADES = [
    { id: 'rod1', name: 'Joran Bambu', type: 'rod', price: 0, str: 100, speed: 1, desc: 'Dasar tapi berguna.' },
    { id: 'rod2', name: 'Joran Fiber', type: 'rod', price: 600, str: 200, speed: 1.3, desc: 'Lebih kuat & lentur.' },
    { id: 'rod3', name: 'Joran Karbon', type: 'rod', price: 2500, str: 400, speed: 1.8, desc: 'Profesional grade.' },
    { id: 'bait1', name: 'Cacing Tanah', type: 'bait', price: 0, luck: 1, desc: 'Umpan standar.' },
    { id: 'bait2', name: 'Udang Segar', type: 'bait', price: 800, luck: 1.5, desc: 'Menarik ikan langka.' },
    { id: 'bait3', name: 'Umpan Ajaib', type: 'bait', price: 3000, luck: 3, desc: 'Semua ikan menyukainya!' }
];

// --- GAME STATE ---
const state = {
    money: 0, level: 1, xp: 0, nextLevelXp: 100,
    rodIdx: 0, baitIdx: 0,
    phase: 'IDLE',
    hook: { x: 0, y: 0, targetY: 0, vy: 0 },
    fish: null, tension: 0, fStam: 0,
    isPressing: false,
    weather: 'clear', wTimer: 0,
    particles: [], ripples: [], bgFish: [], clouds: [], mountains: [],
    obstacles: [],
    boatY: 0, time: 0, started: false,
    boatAngle: 0, armAngle: 0
};

// --- AUDIO SYSTEM ---
let audioCtx, musicNodes = [], isMusicOn = false;
function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }

function playTone(freq, type, dur, vol=0.1) {
    if(!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
}

function sfx(type) {
    if(type==='cast') playTone(400,'triangle',0.3,0.2);
    if(type==='bite') { playTone(800,'sine',0.1,0.2); setTimeout(()=>playTone(800,'sine',0.1,0.2),150); }
    if(type==='reel') playTone(100,'sawtooth',0.05,0.05);
    if(type==='snap') playTone(150,'square',0.3,0.3);
    if(type==='coin') { playTone(1200,'sine',0.1,0.2); setTimeout(()=>playTone(1800,'sine',0.2,0.2),100); }
    if(type==='lvlup') { playTone(400,'square',0.1,0.2); setTimeout(()=>playTone(600,'square',0.1,0.2),100); setTimeout(()=>playTone(800,'square',0.4,0.2),200); }
}

function toggleMusic() {
    initAudio();
    if(isMusicOn) {
        musicNodes.forEach(n=>n.stop()); musicNodes=[]; isMusicOn=false;
        document.getElementById('music-btn').innerText='🔇';
    } else {
        isMusicOn=true; document.getElementById('music-btn').innerText='🎵';
        const playNote = () => {
            if(!isMusicOn) return;
            const notes = [261,293,329,349,392,349,329,293];
            const n = notes[Math.floor(Math.random()*notes.length)];
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type='sine'; o.frequency.value=n;
            o.connect(g); g.connect(audioCtx.destination);
            g.gain.setValueAtTime(0.03, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+2);
            o.start(); o.stop(audioCtx.currentTime+2);
            musicNodes.push(o);
            setTimeout(playNote, 1000 + Math.random()*1000);
        };
        playNote();
    }
}

// --- CANVAS SETUP ---
const cvs = document.getElementById('gameCanvas');
const ctx = cvs.getContext('2d');
let W, H, waterLine;

function resize() {
    W = cvs.width = cvs.parentElement.clientWidth;
    H = cvs.height = cvs.parentElement.clientHeight;
    waterLine = H * 0.45;
    initBackground();
}
window.addEventListener('resize', resize);

// --- GRAPHICS GENERATION ---
function initBackground() {
    state.mountains = [];
    for(let i=0; i<3; i++) {
        let pts = [];
        for(let x=0; x<=W; x+=50) pts.push({x, y: waterLine - 50 - (i*40) - Math.random()*60});
        state.mountains.push({pts, color: `rgba(44, 62, 80, ${0.3 + i*0.2})`, speed: 0.2 + i*0.1});
    }
    state.clouds = [];
    for(let i=0; i<5; i++) state.clouds.push({x: Math.random()*W, y: Math.random()*(waterLine/2), w: 60+Math.random()*80, s: 0.1+Math.random()*0.2});
    state.bgFish = [];
    for(let i=0; i<8; i++) spawnBgFish();
    state.obstacles = [];
    for(let i=0; i<5; i++) spawnObstacle();
}

function spawnBgFish() {
    state.bgFish.push({
        x: Math.random()*W, y: waterLine + 50 + Math.random()*(H-waterLine-100),
        vx: (Math.random()-0.5)*2, size: 10+Math.random()*20,
        color: ['#f1c40f','#e67e22','#3498db','#9b59b6'][Math.floor(Math.random()*4)],
        frame: Math.random()*100
    });
}

function spawnObstacle() {
    const types = ['rock', 'log', 'barrel', 'seaweed'];
    const type = types[Math.floor(Math.random()*types.length)];
    state.obstacles.push({
        x: Math.random()*W, 
        y: waterLine + 30 + Math.random()*(H-waterLine-100),
        type: type,
        vx: (Math.random()-0.5)*0.5,
        vy: Math.random()*0.3,
        rotation: Math.random()*Math.PI*2,
        rotSpeed: (Math.random()-0.5)*0.02,
        size: 20 + Math.random()*30
    });
}

function drawFish(ctx, x, y, size, color, frame, flip=false) {
    ctx.save();
    ctx.translate(x, y);
    if(flip) ctx.scale(-1, 1);
    
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(0, 0, size, size*0.6, 0, 0, Math.PI*2);
    ctx.fill();
    
    const tailWag = Math.sin(frame * 0.2) * 5;
    ctx.beginPath();
    ctx.moveTo(-size*0.8, 0);
    ctx.lineTo(-size*1.4, -size*0.5 + tailWag);
    ctx.lineTo(-size*1.4, size*0.5 + tailWag);
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(size*0.5, -size*0.15, size*0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'black';
    ctx.beginPath(); ctx.arc(size*0.55, -size*0.15, size*0.08, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, size*0.2);
    ctx.quadraticCurveTo(-size*0.3, size*0.8, size*0.2, size*0.5);
    ctx.fill();
    ctx.globalAlpha = 1;
    
    ctx.restore();
}

function drawObstacle(ctx, obs) {
    ctx.save();
    ctx.translate(obs.x, obs.y);
    ctx.rotate(obs.rotation);
    
    if(obs.type === 'rock') {
        ctx.fillStyle = '#7f8c8d';
        ctx.beginPath();
        ctx.moveTo(-obs.size, obs.size*0.5);
        ctx.lineTo(-obs.size*0.5, -obs.size*0.8);
        ctx.lineTo(obs.size*0.3, -obs.size*0.5);
        ctx.lineTo(obs.size, obs.size*0.6);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#95a5a6';
        ctx.beginPath();
        ctx.arc(-obs.size*0.3, -obs.size*0.2, obs.size*0.2, 0, Math.PI*2);
        ctx.fill();
    } else if(obs.type === 'log') {
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(-obs.size, -obs.size*0.3, obs.size*2, obs.size*0.6);
        ctx.fillStyle = '#A0522D';
        ctx.fillRect(-obs.size*0.8, -obs.size*0.2, obs.size*1.6, obs.size*0.4);
        ctx.fillStyle = '#654321';
        ctx.beginPath(); ctx.arc(-obs.size*0.8, 0, obs.size*0.25, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(obs.size*0.8, 0, obs.size*0.25, 0, Math.PI*2); ctx.fill();
    } else if(obs.type === 'barrel') {
        ctx.fillStyle = '#8B4513';
        ctx.beginPath();
        ctx.ellipse(0, 0, obs.size*0.6, obs.size*0.8, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(-obs.size*0.5, -obs.size*0.3, obs.size, obs.size*0.1);
        ctx.fillRect(-obs.size*0.5, obs.size*0.2, obs.size, obs.size*0.1);
    } else if(obs.type === 'seaweed') {
        ctx.strokeStyle = '#27ae60';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        for(let i=-2; i<=2; i++) {
            ctx.beginPath();
            ctx.moveTo(i*10, 0);
            ctx.quadraticCurveTo(
                i*10 + Math.sin(state.time*0.05 + i)*20, 
                -obs.size, 
                i*5 + Math.sin(state.time*0.03 + i)*30, 
                -obs.size*1.5
            );
            ctx.stroke();
        }
    }
    
    ctx.restore();
}

// --- CORE LOOP ---
function update() {
    if(!state.started) return;
    state.time++;

    state.wTimer++;
    if(state.wTimer > 3000) {
        const weathers = ['clear', 'cloudy', 'rain', 'night'];
        state.weather = weathers[Math.floor(Math.random()*weathers.length)];
        state.wTimer = 0;
        document.getElementById('weather-badge').innerText = 
            state.weather==='clear'?'☀️ Cerah':state.weather==='cloudy'?'☁️ Berawan':state.weather==='rain'?'🌧️ Hujan':'🌙 Malam';
    }

    state.clouds.forEach(c => { c.x += c.s; if(c.x > W+100) c.x = -100; });
    state.bgFish.forEach(f => {
        f.x += f.vx; f.frame++;
        if(f.x < -50 || f.x > W+50) { f.vx *= -1; }
    });
    
    state.obstacles.forEach(obs => {
        obs.x += obs.vx;
        obs.y += obs.vy;
        obs.rotation += obs.rotSpeed;
        if(obs.x > W+50) obs.x = -50;
        if(obs.x < -50) obs.x = W+50;
        if(obs.y > H) obs.y = waterLine + 30;
        if(obs.y < waterLine) obs.y = H - 30;
    });
    
    for(let i=state.particles.length-1; i>=0; i--) {
        let p = state.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life--;
        if(p.life<=0) state.particles.splice(i,1);
    }
    for(let i=state.ripples.length-1; i>=0; i--) {
        state.ripples[i].r += 2; state.ripples[i].a -= 0.05;
        if(state.ripples[i].a<=0) state.ripples.splice(i,1);
    }

    state.boatY = waterLine - 10 + Math.sin(state.time*0.05)*5;
    
    if(state.phase === 'REELING') {
        state.boatAngle = Math.sin(state.time*0.2) * 0.05;
        state.armAngle = Math.sin(state.time*0.3) * 0.3;
    } else {
        state.boatAngle = Math.sin(state.time*0.05) * 0.02;
        state.armAngle = 0;
    }

    if(state.phase === 'CASTING') {
        state.hook.y += 8;
        if(state.hook.y >= state.hook.targetY) {
            state.phase = 'WAITING';
            state.ripples.push({x:state.hook.x, y:state.hook.y, r:5, a:1});
            scheduleBite();
        }
    } else if(state.phase === 'REELING') {
        const rod = UPGRADES[state.rodIdx];
        const f = state.fish;
        
        if(state.isPressing) {
            state.tension += 1.5 * f.diff;
            state.fStam -= 0.8 * rod.speed;
            if(Math.random()<0.2) sfx('reel');
        } else {
            state.tension -= 3;
            state.fStam += 0.5;
        }
        
        state.tension = Math.max(0, Math.min(100, state.tension));
        state.fStam = Math.max(0, Math.min(f.stamina, state.fStam));
        
        document.getElementById('tension-bar').style.width = state.tension + '%';
        document.getElementById('stamina-bar').style.width = (state.fStam/f.stamina*100) + '%';

        if(state.tension >= rod.str) breakLine();
        else if(state.fStam <= 0) catchFish();
    }
}

function draw() {
    if(!state.started) return;
    ctx.clearRect(0,0,W,H);

    const skyGrad = ctx.createLinearGradient(0,0,0,waterLine);
    if(state.weather==='night') { skyGrad.addColorStop(0,'#0f0c29'); skyGrad.addColorStop(1,'#302b63'); }
    else if(state.weather==='rain') { skyGrad.addColorStop(0,'#636fa4'); skyGrad.addColorStop(1,'#e0eafc'); }
    else { skyGrad.addColorStop(0,'#4facfe'); skyGrad.addColorStop(1,'#00f2fe'); }
    ctx.fillStyle = skyGrad; ctx.fillRect(0,0,W,waterLine);

    ctx.fillStyle = state.weather==='night' ? '#f1c40f' : '#fff';
    ctx.beginPath(); ctx.arc(W-80, 80, 40, 0, Math.PI*2); ctx.fill();
    if(state.weather==='night') {
        ctx.fillStyle='#0f0c29'; ctx.beginPath(); ctx.arc(W-95, 70, 35, 0, Math.PI*2); ctx.fill();
    }

    state.mountains.forEach(m => {
        ctx.fillStyle = m.color;
        ctx.beginPath(); ctx.moveTo(0, waterLine);
        m.pts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(W, waterLine); ctx.fill();
    });

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    state.clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.w*0.3, 0, Math.PI*2);
        ctx.arc(c.x+c.w*0.3, c.y-c.w*0.1, c.w*0.4, 0, Math.PI*2);
        ctx.arc(c.x+c.w*0.6, c.y, c.w*0.3, 0, Math.PI*2);
        ctx.fill();
    });

    const wGrad = ctx.createLinearGradient(0,waterLine,0,H);
    wGrad.addColorStop(0, state.weather==='night'?'#001a33':'#006994');
    wGrad.addColorStop(1, state.weather==='night'?'#000510':'#003366');
    ctx.fillStyle = wGrad; ctx.fillRect(0,waterLine,W,H-waterLine);

    state.bgFish.forEach(f => drawFish(ctx, f.x, f.y, f.size, f.color, f.frame, f.vx<0));
    state.obstacles.forEach(obs => drawObstacle(ctx, obs));

    if(state.weather==='rain') {
        ctx.strokeStyle='rgba(174,214,241,0.5)'; ctx.lineWidth=1;
        for(let i=0; i<50; i++) {
            let rx=Math.random()*W, ry=Math.random()*H;
            ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-2,ry+10); ctx.stroke();
        }
    }

    const bx = W/2, by = state.boatY;
    
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(state.boatAngle);
    
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.moveTo(-80, 0);
    ctx.lineTo(80, 0);
    ctx.lineTo(70, 40);
    ctx.lineTo(-70, 40);
    ctx.closePath();
    ctx.fill();
    
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(-75, 15, 150, 8);
    
    ctx.fillStyle = '#A0522D';
    ctx.fillRect(-65, 5, 130, 10);
    
    ctx.fillStyle = '#654321';
    ctx.fillRect(-30, -20, 60, 25);
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(-25, -15, 20, 15);
    ctx.fillRect(5, -15, 20, 15);
    
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(60, -20); ctx.lineTo(60, -45); ctx.stroke();
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(60, -45);
    ctx.lineTo(80, -38);
    ctx.lineTo(60, -31);
    ctx.closePath();
    ctx.fill();
    
    const charX = -15;
    const charY = -25;
    
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(charX+5, 15, 12, 25);
    ctx.fillRect(charX-5, 15, 12, 25);
    
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(charX-10, -10, 30, 30);
    
    ctx.fillStyle = '#f39c12';
    ctx.fillRect(charX-8, -5, 26, 20);
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(charX-5, 0, 8, 12);
    
    ctx.save();
    ctx.translate(charX+15, -5);
    ctx.rotate(state.armAngle);
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(0, 0, 25, 10);
    ctx.restore();
    
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(charX-15, -5, 20, 10);
    
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.arc(charX+5, -20, 14, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath();
    ctx.ellipse(charX+5, -28, 20, 8, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(charX-10, -35, 30, 10);
    
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.arc(charX+8, -22, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(charX+2, -18, 3, 0, Math.PI); ctx.fill();
    
    ctx.restore();

    const hx = bx+20, hy = by-30;
    ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(hx, hy);
    
    let tipX = hx+50, tipY = hy-70;
    if(state.phase==='REELING' || state.phase==='BITING') {
        const bend = (state.tension/100)*60;
        tipY -= bend;
        ctx.quadraticCurveTo(hx+25, hy-35, tipX, tipY);
    } else {
        ctx.lineTo(tipX, tipY);
    }
    ctx.stroke();

    if(state.phase !== 'IDLE') {
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(state.hook.x, state.hook.y); ctx.stroke();
        
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(state.hook.x, state.hook.y, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(state.hook.x, state.hook.y-7, 5, 0, Math.PI*2); ctx.fill();
    }

    state.particles.forEach(p => {
        ctx.fillStyle = `rgba(255,255,255,${p.life/30})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    });

    state.ripples.forEach(r => {
        ctx.strokeStyle = `rgba(255,255,255,${r.a})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r*0.3, 0, 0, Math.PI*2); ctx.stroke();
    });

    if(state.weather==='night') { ctx.fillStyle='rgba(0,0,20,0.4)'; ctx.fillRect(0,0,W,H); }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// --- GAMEPLAY FUNCTIONS ---
function startGame() {
    initAudio(); resize();
    document.getElementById('start-screen').style.display='none';
    state.started = true;
    updateUI();
}

function castLine() {
    if(state.phase!=='IDLE' && state.phase!=='WAITING') return;
    document.getElementById('game-logo').style.opacity='0';
    
    state.phase='CASTING'; sfx('cast');
    state.hook.x = (W/2) + (Math.random()-0.5)*200;
    state.hook.y = waterLine;
    
    const available = FISH_DB.filter(f => f.minLvl <= state.level && (f.weather.includes('all') || f.weather.includes(state.weather)));
    const target = available.length ? available[Math.floor(Math.random()*available.length)] : FISH_DB[0];
    state.hook.targetY = waterLine + (H-waterLine) * (target.depth[0] + Math.random()*(target.depth[1]-target.depth[0]));
    
    document.getElementById('action-btn').innerHTML = "TUNGGU...";
    document.getElementById('action-btn').classList.remove('reeling');
}

function scheduleBite() {
    const delay = (2000 + Math.random()*3000) / UPGRADES[state.baitIdx].luck;
    setTimeout(() => {
        if(state.phase!=='WAITING') return;
        const available = FISH_DB.filter(f => f.minLvl <= state.level && (f.weather.includes('all') || f.weather.includes(state.weather)));
        let chosen = available[0];
        if(Math.random() < 0.3 * UPGRADES[state.baitIdx].luck) {
            const rares = available.filter(f => f.diff >= 3);
            if(rares.length) chosen = rares[Math.floor(Math.random()*rares.length)];
        } else {
            chosen = available[Math.floor(Math.random()*available.length)];
        }
        state.fish = chosen; triggerBite();
    }, delay);
}

function triggerBite() {
    state.phase='BITING'; sfx('bite');
    state.ripples.push({x:state.hook.x, y:state.hook.y, r:5, a:1});
    showNotif("❗ STRIKE!");
    const btn = document.getElementById('action-btn');
    btn.innerHTML = "TARIK!!"; btn.classList.add('reeling');
    
    setTimeout(() => {
        if(state.phase==='BITING') {
            state.phase='WAITING'; showNotif("Ikan Lepas...");
            btn.innerHTML = "LEMPAR"; btn.classList.remove('reeling');
            scheduleBite();
        }
    }, 1200);
}

function hookFish() {
    state.phase='REELING'; state.tension=20; state.fStam=state.fish.stamina;
    document.getElementById('minigame-ui').style.display='block';
    document.getElementById('action-btn').innerHTML = "TAHAN!";
}

function breakLine() { sfx('snap'); endReel(false, "Garis Putus!"); }

function catchFish() {
    sfx('coin');
    const f = state.fish;
    state.money += f.value;
    addXP(f.xp);
    
    for(let i=0; i<15; i++) {
        state.particles.push({
            x: state.hook.x, y: waterLine, 
            vx: (Math.random()-0.5)*10, vy: -Math.random()*10 - 5, 
            life: 30+Math.random()*20, size: 2+Math.random()*3
        });
    }

    document.getElementById('catch-icon').innerText = '🐟';
    document.getElementById('catch-name').innerText = f.name;
    document.getElementById('catch-xp-val').innerText = f.xp;
    document.getElementById('catch-money').innerText = f.value;
    document.getElementById('catch-card').classList.add('show');
    
    setTimeout(() => {
        document.getElementById('catch-card').classList.remove('show');
        endReel(true);
    }, 2000);
}

function endReel(success, msg) {
    state.phase='IDLE';
    document.getElementById('minigame-ui').style.display='none';
    document.getElementById('action-btn').innerHTML = "LEMPAR<br><span style='font-size:12px; opacity:0.8'>(Spasi)</span>";
    document.getElementById('action-btn').classList.remove('reeling');
    if(!success) showNotif(msg);
    updateUI();
}

function addXP(amount) {
    state.xp += amount;
    if(state.xp >= state.nextLevelXp) {
        state.level++;
        state.xp -= state.nextLevelXp;
        state.nextLevelXp = Math.floor(state.nextLevelXp * 1.5);
        sfx('lvlup');
        showNotif(`🎉 LEVEL UP! LVL ${state.level}`);
    }
    updateUI();
}

function updateUI() {
    document.getElementById('money-display').innerText = state.money;
    document.getElementById('level-display').innerText = state.level;
    const pct = (state.xp / state.nextLevelXp) * 100;
    document.getElementById('xp-bar').style.width = pct + '%';
}

function showNotif(txt) {
    const el = document.getElementById('notification');
    el.innerText = txt; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1500);
}

// --- INPUTS ---
const btn = document.getElementById('action-btn');
function onStart(e) {
    e.preventDefault(); initAudio(); state.isPressing=true;
    if(!state.started) return;
    if(state.phase==='IDLE'||state.phase==='WAITING') castLine();
    else if(state.phase==='BITING') hookFish();
}
function onEnd(e) { e.preventDefault(); state.isPressing=false; }

btn.addEventListener('mousedown', onStart); btn.addEventListener('touchstart', onStart);
window.addEventListener('mouseup', onEnd); window.addEventListener('touchend', onEnd);
document.addEventListener('keydown', e => {
    if(e.code==='Space') {
        e.preventDefault();
        if(!state.started) { startGame(); return; }
        initAudio(); state.isPressing=true;
        if(state.phase==='IDLE'||state.phase==='WAITING') castLine();
        else if(state.phase==='BITING') hookFish();
    }
});
document.addEventListener('keyup', e => { if(e.code==='Space') state.isPressing=false; });

// --- SHOP SYSTEM ---
function toggleShop() {
    const m = document.getElementById('shop-modal');
    if(m.style.display==='flex') m.style.display='none';
    else { renderShop(); m.style.display='flex'; }
}

function renderShop() {
    const list = document.getElementById('shop-list'); list.innerHTML='';
    UPGRADES.forEach((u, i) => {
        const isRod = u.type==='rod';
        const myLvl = isRod ? state.rodLvl : state.baitLvl;
        const itemLvl = isRod ? i : i-3;
        
        let canBuy = false;
        let isEquipped = false;
        let owned = false;
        
        if(itemLvl === myLvl) isEquipped = true;
        if(itemLvl === myLvl + 1 && state.money >= u.price) canBuy = true;
        if(itemLvl < myLvl) owned = true;
        
        const div = document.createElement('div');
        div.className = 'shop-item' + (isEquipped?' equipped':'') + ((!canBuy && !owned && !isEquipped)?' disabled':'');
        div.innerHTML = `
            <div>
                <div class="item-name">${isRod?'🎣':''} ${u.name}</div>
                <div class="item-desc">${u.desc}</div>
            </div>
            <div class="item-cost">${isEquipped?'✅ PAKAI':(owned?'✔':'💰'+u.price)}</div>
        `;
        if(canBuy) div.onclick = () => buyItem(i, isRod);
        list.appendChild(div);
    });
}

state.rodLvl = 0; state.baitLvl = 0;

function buyItem(idx, isRod) {
    const u = UPGRADES[idx];
    if(state.money >= u.price) {
        state.money -= u.price; sfx('coin');
        if(isRod) state.rodLvl = idx;
        else state.baitLvl = idx - 3;
        renderShop(); updateUI();
        showNotif(`Dibeli: ${u.name}!`);
    }
}

resize();
loop();

</script>
</body>
